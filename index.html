{id:9,t:"\u0625\u062f\u0627\u0631\u0629 \u0627\u0644\u0648\u0642\u062a \u0648\u0627\u0644\u0625\u0646\u062a\u0627\u062c\u064a\u0629",i:"\u0641\u0631\u064a\u0642 \u0623\u0643\u0627\u062f\u064a\u0645\u064a\u0629 \u062f\u064e\u0631\u0652\u0628",c:"\u062a\u0637\u0648\u064a\u0631 \u0627\u0644\u0630\u0627\u062a",e:"\u23f1\ufe0f",g:"#1c4e80,#3f88c5",r:0,n:0,p:0,l:["\u0627\u0628\u062f\u0623 \u0628\u0645\u0627 \u064a\u0647\u0645 \u0641\u0639\u0644\u0627\u064b","\u062e\u0637\u0651\u0629 \u0627\u0644\u064a\u0648\u0645 \u0641\u064a \u0639\u0634\u0631 \u062f\u0642\u0627\u0626\u0642","\u0627\u0639\u0645\u0644 \u0628\u062a\u0631\u0643\u064a\u0632","\u0631\u0627\u062c\u0639 \u0648\u0637\u0648\u0651\u0631 \u0639\u0627\u062f\u062a\u0643"],x:["\u0644\u064a\u0633\u062a \u0643\u0644 \u0627\u0644\u0645\u0647\u0627\u0645 \u0645\u062a\u0633\u0627\u0648\u064a\u0629. \u0627\u0643\u062a\u0628 \u0643\u0644 \u0645\u0627 \u0639\u0644\u064a\u0643\u060c \u062b\u0645 \u0627\u062e\u062a\u0631 \u0645\u0647\u0645\u0629 \u0623\u0648 \u0645\u0647\u0645\u062a\u064a\u0646 \u064a\u0635\u0646\u0639\u0627\u0646 \u0623\u0643\u0628\u0631 \u0641\u0631\u0642 \u0641\u064a \u0623\u0647\u062f\u0627\u0641\u0643\u060c \u0648\u0627\u0628\u062f\u0623 \u0628\u0647\u0645\u0627 \u0642\u0628\u0644 \u0623\u064a \u0634\u064a\u0621 \u0622\u062e\u0631. \u0627\u0644\u0645\u0647\u0627\u0645 \u0627\u0644\u0639\u0627\u062c\u0644\u0629 \u0644\u0627 \u062a\u0639\u0646\u064a \u062f\u0627\u0626\u0645\u064b\u0627 \u0623\u0646\u0647\u0627 \u0645\u0647\u0645\u0629.","\u0641\u064a \u0622\u062e\u0631 \u0627\u0644\u0645\u0633\u0627\u0621 \u0623\u0648 \u0623\u0648\u0644 \u0627\u0644\u0635\u0628\u0627\u062d\u060c \u0627\u0643\u062a\u0628 \u062b\u0644\u0627\u062b \u0645\u0647\u0627\u0645 \u0631\u0626\u064a\u0633\u064a\u0629 \u0644\u0644\u064a\u0648\u0645 \u0648\u0642\u062f\u0651\u0631 \u0648\u0642\u062a \u0643\u0644 \u0648\u0627\u062d\u062f\u0629. \u0627\u062a\u0631\u0643 \u0641\u0631\u0627\u063a\u064b\u0627 \u0641\u064a \u062c\u062f\u0648\u0644\u0643 \u0644\u0644\u0637\u0648\u0627\u0631\u0626\u060c \u0641\u0627\u0644\u062c\u062f\u0648\u0644 \u0627\u0644\u0645\u0645\u062a\u0644\u0626 \u062a\u0645\u0627\u0645\u064b\u0627 \u064a\u0646\u0647\u0627\u0631 \u0639\u0646\u062f \u0623\u0648\u0644 \u0645\u0642\u0627\u0637\u0639\u0629.","\u0627\u0639\u0645\u0644 \u0639\u0644\u0649 \u0645\u0647\u0645\u0629 \u0648\u0627\u062d\u062f\u0629 \u0644\u0645\u062f\u0629 \u062e\u0645\u0633\u064d \u0648\u0639\u0634\u0631\u064a\u0646 \u062f\u0642\u064a\u0642\u0629 \u0645\u0639 \u0625\u063a\u0644\u0627\u0642 \u0627\u0644\u0625\u0634\u0639\u0627\u0631\u0627\u062a\u060c \u062b\u0645 \u0627\u0633\u062a\u0631\u062d \u062e\u0645\u0633 \u062f\u0642\u0627\u0626\u0642. \u0643\u0631\u0651\u0631 \u0647\u0630\u0647 \u0627\u0644\u062f\u0648\u0631\u0629 \u0639\u062f\u0629 \u0645\u0631\u0627\u062a\u060c \u0648\u0633\u062a\u0644\u0627\u062d\u0638 \u0623\u0646 \u0625\u0646\u062c\u0627\u0632\u0643 \u064a\u0632\u064a\u062f \u062f\u0648\u0646 \u0625\u0631\u0647\u0627\u0642.","\u0641\u064a \u0646\u0647\u0627\u064a\u0629 \u0627\u0644\u0623\u0633\u0628\u0648\u0639 \u0627\u0633\u0623\u0644 \u0646\u0641\u0633\u0643: \u0645\u0627\u0630\u0627 \u0623\u0646\u062c\u0632\u062a\u061f \u0648\u0645\u0627 \u0627\u0644\u0630\u064a \u0623\u0636\u0627\u0639 \u0648\u0642\u062a\u064a\u061f \u0627\u062e\u062a\u0631 \u0639\u0627\u062f\u0629 \u0648\u0627\u062d\u062f\u0629 \u062a\u062d\u0633\u0651\u0646\u0647\u0627 \u0627\u0644\u0623\u0633\u0628\u0648\u0639 \u0627\u0644\u0642\u0627\u062f\u0645 \u0628\u062f\u0644 \u062a\u063a\u064a\u064a\u0631 \u0643\u0644 \u0634\u064a\u0621 \u062f\u0641\u0639\u0629 \u0648\u0627\u062d\u062f\u0629."]},
{id:10,t:"\u0623\u0633\u0627\u0633\u064a\u0627\u062a \u0627\u0644\u062a\u062c\u0627\u0631\u0629 \u0627\u0644\u0625\u0644\u0643\u062a\u0631\u0648\u0646\u064a\u0629",i:"\u0641\u0631\u064a\u0642 \u0623\u0643\u0627\u062f\u064a\u0645\u064a\u0629 \u062f\u064e\u0631\u0652\u0628",c:"\u0623\u0639\u0645\u0627\u0644",e:"\ud83d\udecd\ufe0f",g:"#9a5b13,#e3a008",r:0,n:0,p:0,l:["\u0643\u064a\u0641 \u062a\u062e\u062a\u0627\u0631 \u0645\u0646\u062a\u062c\u064b\u0627 \u0645\u0646\u0627\u0633\u0628\u064b\u0627","\u062c\u0647\u0651\u0632 \u0645\u062a\u062c\u0631\u0643 \u0648\u0635\u0641\u062d\u0627\u062a \u0627\u0644\u0645\u0646\u062a\u062c\u0627\u062a","\u0627\u0644\u062f\u0641\u0639 \u0648\u0627\u0644\u0634\u062d\u0646 \u0648\u062e\u062f\u0645\u0629 \u0627\u0644\u0639\u0645\u0644\u0627\u0621","\u0627\u062c\u0630\u0628 \u0623\u0648\u0644 \u0639\u0645\u0644\u0627\u0626\u0643"],x:["\u0627\u0628\u062d\u062b \u0639\u0646 \u0645\u0646\u062a\u062c \u064a\u062d\u062a\u0627\u062c\u0647 \u0627\u0644\u0646\u0627\u0633 \u0641\u0639\u0644\u0627\u064b\u060c \u0648\u064a\u0645\u0643\u0646\u0643 \u062a\u0648\u0641\u064a\u0631\u0647 \u0628\u062c\u0648\u062f\u0629 \u062c\u064a\u062f\u0629 \u0648\u0647\u0627\u0645\u0634 \u0631\u0628\u062d \u0645\u0639\u0642\u0648\u0644 \u0628\u0639\u062f \u062d\u0633\u0627\u0628 \u0627\u0644\u062a\u0643\u0644\u0641\u0629 \u0648\u0627\u0644\u0634\u062d\u0646. \u062c\u0631\u0651\u0628 \u0627\u0644\u0641\u0643\u0631\u0629 \u0628\u0643\u0645\u064a\u0629 \u0635\u063a\u064a\u0631\u0629 \u0642\u0628\u0644 \u0623\u0646 \u062a\u0633\u062a\u062b\u0645\u0631 \u0645\u0628\u0644\u063a\u064b\u0627 \u0643\u0628\u064a\u0631\u064b\u0627.","\u0627\u0643\u062a\u0628 \u0644\u0643\u0644 \u0645\u0646\u062a\u062c \u0639\u0646\u0648\u0627\u0646\u064b\u0627 \u0648\u0627\u0636\u062d\u064b\u0627 \u0648\u0648\u0635\u0641\u064b\u0627 \u064a\u062c\u064a\u0628 \u0639\u0646 \u0623\u0633\u0626\u0644\u0629 \u0627\u0644\u0639\u0645\u064a\u0644\u060c \u0648\u0623\u0636\u0641 \u0635\u0648\u0631\u064b\u0627 \u062c\u064a\u062f\u0629. \u0627\u062c\u0639\u0644 \u062e\u0637\u0648\u0627\u062a \u0627\u0644\u0634\u0631\u0627\u0621 \u0642\u0635\u064a\u0631\u0629\u060c \u0648\u0623\u0638\u0647\u0631 \u0633\u064a\u0627\u0633\u0629 \u0627\u0644\u0625\u0631\u062c\u0627\u0639 \u0648\u0627\u0644\u062a\u0648\u0627\u0635\u0644 \u0628\u0648\u0636\u0648\u062d \u0644\u062a\u0643\u0633\u0628 \u0627\u0644\u062b\u0642\u0629.","\u0648\u0641\u0651\u0631 \u0637\u0631\u0642 \u062f\u0641\u0639 \u0645\u0648\u062b\u0648\u0642\u0629 \u064a\u0639\u0631\u0641\u0647\u0627 \u0639\u0645\u0644\u0627\u0624\u0643\u060c \u0648\u0627\u062a\u0641\u0642 \u0645\u0639 \u0634\u0631\u0643\u0629 \u0634\u062d\u0646 \u0648\u0627\u0636\u062d\u0629 \u0641\u064a \u0627\u0644\u0623\u0633\u0639\u0627\u0631 \u0648\u0645\u062f\u0629 \u0627\u0644\u062a\u0648\u0635\u064a\u0644. \u0631\u062f\u0651 \u0639\u0644\u0649 \u0627\u0644\u0627\u0633\u062a\u0641\u0633\u0627\u0631\u0627\u062a \u0628\u0633\u0631\u0639\u0629\u060c \u0641\u0633\u0631\u0639\u0629 \u0627\u0644\u0631\u062f \u062a\u0624\u062b\u0631 \u0641\u064a \u0642\u0631\u0627\u0631 \u0627\u0644\u0634\u0631\u0627\u0621.","\u0627\u0628\u062f\u0623 \u0628\u0623\u0633\u0644\u0648\u0628 \u0648\u0627\u062d\u062f \u062a\u062a\u0642\u0646\u0647: \u0645\u062d\u062a\u0648\u0649 \u0642\u0635\u064a\u0631 \u0639\u0644\u0649 \u0648\u0633\u0627\u0626\u0644 \u0627\u0644\u062a\u0648\u0627\u0635\u0644\u060c \u0623\u0648 \u0625\u0639\u0644\u0627\u0646\u0627\u062a \u0628\u0645\u064a\u0632\u0627\u0646\u064a\u0629 \u0635\u063a\u064a\u0631\u0629\u060c \u0623\u0648 \u062a\u0648\u0635\u064a\u0629 \u0627\u0644\u0639\u0645\u0644\u0627\u0621 \u0627\u0644\u0623\u0648\u0627\u0626\u0644. \u0642\u0650\u0633 \u0627\u0644\u0646\u062a\u0627\u0626\u062c\u060c \u0648\u0643\u0631\u0651\u0631 \u0645\u0627 \u064a\u0646\u062c\u062d \u0648\u0623\u0648\u0642\u0641 \u0645\u0627 \u0644\u0627 \u064a\u0639\u0637\u064a \u0646\u062a\u064a\u062c\u0629."]},
{id:11,t:"\u0627\u0644\u062a\u0648\u0627\u0635\u0644 \u0627\u0644\u0641\u0639\u0651\u0627\u0644 \u0648\u0627\u0644\u0625\u0642\u0646\u0627\u0639",i:"\u0641\u0631\u064a\u0642 \u0623\u0643\u0627\u062f\u064a\u0645\u064a\u0629 \u062f\u064e\u0631\u0652\u0628",c:"\u062a\u0637\u0648\u064a\u0631 \u0627\u0644\u0630\u0627\u062a",e:"\ud83d\udde3\ufe0f",g:"#7b2d5e,#c05c9b",r:0,n:0,p:0,l:["\u0627\u0633\u0645\u0639 \u0623\u0648\u0644\u064b\u0627","\u0631\u062a\u0651\u0628 \u0641\u0643\u0631\u062a\u0643","\u0627\u0637\u0644\u0628 \u0628\u0648\u0636\u0648\u062d \u0648\u0644\u0628\u0627\u0642\u0629","\u062a\u0639\u0627\u0645\u0644 \u0645\u0639 \u0627\u0644\u0627\u0639\u062a\u0631\u0627\u0636"],x:["\u0627\u0644\u0625\u0642\u0646\u0627\u0639 \u064a\u0628\u062f\u0623 \u0628\u0627\u0644\u0625\u0646\u0635\u0627\u062a. \u062f\u0639 \u0627\u0644\u0637\u0631\u0641 \u0627\u0644\u0622\u062e\u0631 \u064a\u0634\u0631\u062d \u0648\u062c\u0647\u0629 \u0646\u0638\u0631\u0647 \u062d\u062a\u0649 \u0627\u0644\u0646\u0647\u0627\u064a\u0629\u060c \u062b\u0645 \u0623\u0639\u062f \u0635\u064a\u0627\u063a\u0629 \u0645\u0627 \u0641\u0647\u0645\u062a\u0647 \u0628\u0643\u0644\u0645\u0627\u062a\u0643 \u0644\u0644\u062a\u0623\u0643\u062f. \u0633\u062a\u0643\u0633\u0628 \u0627\u062d\u062a\u0631\u0627\u0645\u0647 \u0648\u062a\u0641\u0647\u0645 \u0645\u0627 \u064a\u062d\u062a\u0627\u062c\u0647 \u0641\u0639\u0644\u0627\u064b.","\u0642\u0628\u0644 \u0623\u0646 \u062a\u062a\u062d\u062f\u062b\u060c \u062d\u062f\u0651\u062f \u0645\u0627 \u0627\u0644\u0630\u064a \u062a\u0631\u064a\u062f\u0647 \u0628\u062c\u0645\u0644\u0629 \u0648\u0627\u062d\u062f\u0629\u060c \u062b\u0645 \u0627\u0630\u0643\u0631 \u0633\u0628\u0628\u064a\u0646 \u0623\u0648 \u062b\u0644\u0627\u062b\u0629 \u0641\u0642\u0637. \u0627\u0644\u0641\u0643\u0631\u0629 \u0627\u0644\u0645\u0631\u062a\u0628\u0629 \u0627\u0644\u0642\u0635\u064a\u0631\u0629 \u0623\u0633\u0647\u0644 \u0641\u064a \u0627\u0644\u062a\u0630\u0643\u0631 \u0648\u0627\u0644\u062a\u0635\u062f\u064a\u0642 \u0645\u0646 \u062d\u062f\u064a\u062b \u0637\u0648\u064a\u0644 \u0645\u062a\u0634\u0639\u0628.","\u0627\u0630\u0643\u0631 \u0637\u0644\u0628\u0643 \u0645\u0628\u0627\u0634\u0631\u0629 \u0645\u0639 \u0627\u0644\u0633\u0628\u0628: \u00ab\u0623\u062d\u062a\u0627\u062c \u0643\u0630\u0627 \u0642\u0628\u0644 \u064a\u0648\u0645 \u0643\u0630\u0627 \u0644\u0623\u0646 \u0643\u0630\u0627\u00bb. \u0627\u0644\u0637\u0644\u0628 \u0627\u0644\u0648\u0627\u0636\u062d \u064a\u0648\u0641\u0651\u0631 \u0627\u0644\u0648\u0642\u062a \u0648\u064a\u0642\u0644\u0644 \u0633\u0648\u0621 \u0627\u0644\u0641\u0647\u0645\u060c \u0648\u0627\u0644\u0644\u0637\u0641 \u0641\u064a \u0627\u0644\u0623\u0633\u0644\u0648\u0628 \u0644\u0627 \u064a\u0639\u0646\u064a \u0627\u0644\u063a\u0645\u0648\u0636 \u0641\u064a \u0627\u0644\u0645\u0636\u0645\u0648\u0646.","\u0639\u0646\u062f \u0627\u0644\u0627\u0639\u062a\u0631\u0627\u0636 \u0644\u0627 \u062a\u062f\u0627\u0641\u0639 \u0641\u0648\u0631\u064b\u0627. \u0627\u0639\u062a\u0631\u0641 \u0628\u0645\u0627 \u0647\u0648 \u0635\u062d\u064a\u062d \u0641\u064a \u0643\u0644\u0627\u0645\u0647\u060c \u0648\u0627\u0633\u0623\u0644 \u0639\u0646 \u0633\u0628\u0628 \u0627\u0639\u062a\u0631\u0627\u0636\u0647\u060c \u062b\u0645 \u0627\u0642\u062a\u0631\u062d \u062d\u0644\u064b\u0627 \u064a\u0631\u0627\u0639\u064a \u0645\u0635\u0644\u062d\u0629 \u0627\u0644\u0637\u0631\u0641\u064a\u0646."]},
{id:12,t:"\u0625\u062f\u0627\u0631\u0629 \u0627\u0644\u0645\u0627\u0644 \u0627\u0644\u0634\u062e\u0635\u064a \u0644\u0644\u0645\u0628\u062a\u062f\u0626\u064a\u0646",i:"\u0641\u0631\u064a\u0642 \u0623\u0643\u0627\u062f\u064a\u0645\u064a\u0629 \u062f\u064e\u0631\u0652\u0628",c:"\u0623\u0639\u0645\u0627\u0644",e:"\ud83d\udcb0",g:"#0b5d3b,#52b788",r:0,n:0,p:0,l:["\u0627\u0639\u0631\u0641 \u0623\u064a\u0646 \u064a\u0630\u0647\u0628 \u0645\u0627\u0644\u0643","\u0645\u064a\u0632\u0627\u0646\u064a\u0629 \u0628\u0633\u064a\u0637\u0629","\u0627\u062f\u062e\u0631 \u0642\u0628\u0644 \u0623\u0646 \u062a\u0646\u0641\u0642","\u0641\u0643\u0651\u0631 \u0641\u064a \u0623\u0647\u062f\u0627\u0641\u0643 \u0627\u0644\u0643\u0628\u064a\u0631\u0629"],x:["\u0633\u062c\u0651\u0644 \u0643\u0644 \u0645\u0635\u0631\u0648\u0641\u0627\u062a\u0643 \u0644\u0645\u062f\u0629 \u0634\u0647\u0631 \u0643\u0627\u0645\u0644\u060c \u062d\u062a\u0649 \u0627\u0644\u0635\u063a\u064a\u0631\u0629 \u0645\u0646\u0647\u0627. \u0633\u062a\u0643\u062a\u0634\u0641 \u0623\u0628\u0648\u0627\u0628\u064b\u0627 \u0644\u0644\u0635\u0631\u0641 \u0644\u0645 \u062a\u0646\u062a\u0628\u0647 \u0644\u0647\u0627\u060c \u0648\u0647\u0630\u0647 \u0623\u0648\u0644 \u062e\u0637\u0648\u0629 \u0644\u0644\u062a\u062d\u0643\u0645 \u0641\u064a \u0645\u0627\u0644\u0643.","\u0642\u0633\u0651\u0645 \u062f\u062e\u0644\u0643 \u0625\u0644\u0649 \u0627\u062d\u062a\u064a\u0627\u062c\u0627\u062a \u0623\u0633\u0627\u0633\u064a\u0629 \u0648\u0631\u063a\u0628\u0627\u062a \u0648\u0627\u062f\u062e\u0627\u0631\u060c \u0648\u062d\u062f\u0651\u062f \u0644\u0643\u0644 \u062c\u0632\u0621 \u0646\u0633\u0628\u0629 \u062a\u0646\u0627\u0633\u0628 \u0638\u0631\u0648\u0641\u0643. \u0627\u0644\u0645\u064a\u0632\u0627\u0646\u064a\u0629 \u0627\u0644\u0648\u0627\u0642\u0639\u064a\u0629 \u0627\u0644\u062a\u064a \u062a\u0644\u062a\u0632\u0645 \u0628\u0647\u0627 \u0623\u0641\u0636\u0644 \u0645\u0646 \u0645\u064a\u0632\u0627\u0646\u064a\u0629 \u0645\u062b\u0627\u0644\u064a\u0629 \u062a\u062a\u0631\u0643\u0647\u0627 \u0628\u0639\u062f \u0623\u0633\u0628\u0648\u0639.","\u0627\u062c\u0639\u0644 \u0627\u0644\u0627\u062f\u062e\u0627\u0631 \u0623\u0648\u0644 \u0645\u0627 \u062a\u0641\u0639\u0644\u0647 \u0639\u0646\u062f \u0648\u0635\u0648\u0644 \u0627\u0644\u062f\u062e\u0644\u060c \u0648\u0644\u0648 \u0643\u0627\u0646 \u0645\u0628\u0644\u063a\u064b\u0627 \u0635\u063a\u064a\u0631\u064b\u0627. \u0627\u0628\u0646\u0650 \u0623\u0648\u0644\u064b\u0627 \u0635\u0646\u062f\u0648\u0642 \u0637\u0648\u0627\u0631\u0626 \u064a\u063a\u0637\u064a \u0645\u0635\u0631\u0648\u0641\u0627\u062a \u0639\u062f\u0629 \u0623\u0634\u0647\u0631 \u0642\u0628\u0644 \u0623\u064a \u0645\u0634\u0631\u0648\u0639 \u0623\u0648 \u0627\u0633\u062a\u062b\u0645\u0627\u0631.","\u062d\u062f\u0651\u062f \u0647\u062f\u0641\u064b\u0627 \u0648\u0627\u0636\u062d\u064b\u0627 \u0645\u062b\u0644 \u0633\u064a\u0627\u0631\u0629 \u0623\u0648 \u0645\u0646\u0632\u0644 \u0628\u0645\u0628\u0644\u063a \u0648\u062a\u0627\u0631\u064a\u062e\u060c \u062b\u0645 \u0627\u062d\u0633\u0628 \u0643\u0645 \u062a\u062d\u062a\u0627\u062c \u0634\u0647\u0631\u064a\u064b\u0627. \u0648\u062a\u062c\u0646\u0651\u0628 \u0627\u0644\u0627\u0633\u062a\u062b\u0645\u0627\u0631 \u0641\u064a \u0634\u064a\u0621 \u0644\u0627 \u062a\u0641\u0647\u0645\u0647 \u0623\u0648 \u0641\u064a \u0645\u0628\u0644\u063a \u0644\u0627 \u062a\u062a\u062d\u0645\u0644 \u062e\u0633\u0627\u0631\u062a\u0647."]},
{id:13,t:"\u0627\u0644\u0630\u0643\u0627\u0621 \u0627\u0644\u0627\u0635\u0637\u0646\u0627\u0639\u064a \u0644\u0644\u0645\u0628\u062a\u062f\u0626\u064a\u0646: \u0627\u0628\u062f\u0623 \u0645\u0646 \u0627\u0644\u0635\u0641\u0631",i:"\u0641\u0631\u064a\u0642 \u0623\u0643\u0627\u062f\u064a\u0645\u064a\u0629 \u062f\u064e\u0631\u0652\u0628",c:"\u0630\u0643\u0627\u0621 \u0627\u0635\u0637\u0646\u0627\u0639\u064a",e:"\ud83e\udde0",g:"#22406e,#6c63ff",r:0,n:0,p:0,l:["\u0645\u0627 \u0647\u0648 \u0627\u0644\u0630\u0643\u0627\u0621 \u0627\u0644\u0627\u0635\u0637\u0646\u0627\u0639\u064a\u061f","\u0643\u064a\u0641 \u062a\u0643\u062a\u0628 \u0637\u0644\u0628\u064b\u0627 \u0648\u0627\u0636\u062d\u064b\u0627","\u0627\u0633\u062a\u062e\u062f\u0645\u0647 \u0641\u064a \u0639\u0645\u0644\u0643 \u0648\u062f\u0631\u0627\u0633\u062a\u0643","\u0627\u062d\u0630\u0631 \u0645\u0646 \u0623\u062e\u0637\u0627\u0626\u0647"],x:["\u0627\u0644\u0630\u0643\u0627\u0621 \u0627\u0644\u0627\u0635\u0637\u0646\u0627\u0639\u064a \u0628\u0631\u0627\u0645\u062c \u062a\u062a\u0639\u0644\u0645 \u0645\u0646 \u0643\u0645\u064a\u0627\u062a \u0636\u062e\u0645\u0629 \u0645\u0646 \u0627\u0644\u0628\u064a\u0627\u0646\u0627\u062a \u0644\u062a\u0642\u062f\u0651\u0645 \u0646\u0635\u064b\u0627 \u0623\u0648 \u0635\u0648\u0631\u0629 \u0623\u0648 \u0625\u062c\u0627\u0628\u0629. \u0647\u0648 \u0623\u062f\u0627\u0629 \u0645\u0633\u0627\u0639\u062f\u0629 \u0642\u0648\u064a\u0629\u060c \u0644\u0643\u0646\u0647 \u0644\u0627 \u064a\u0641\u0647\u0645 \u0627\u0644\u0639\u0627\u0644\u0645 \u0643\u0645\u0627 \u064a\u0641\u0647\u0645\u0647 \u0627\u0644\u0625\u0646\u0633\u0627\u0646\u060c \u0648\u064a\u0645\u0643\u0646 \u0623\u0646 \u064a\u062e\u0637\u0626 \u0628\u062b\u0642\u0629.","\u0627\u0643\u062a\u0628 \u0647\u062f\u0641\u0643 \u0628\u0648\u0636\u0648\u062d\u060c \u0648\u0627\u0630\u0643\u0631 \u0627\u0644\u062c\u0645\u0647\u0648\u0631 \u0648\u0627\u0644\u0623\u0633\u0644\u0648\u0628 \u0648\u0627\u0644\u0637\u0648\u0644 \u0627\u0644\u0645\u0637\u0644\u0648\u0628\u060c \u0648\u0623\u0639\u0637\u0650 \u0645\u062b\u0627\u0644\u064b\u0627 \u0625\u0646 \u0623\u0645\u0643\u0646. \u0643\u0644\u0645\u0627 \u0643\u0627\u0646 \u0637\u0644\u0628\u0643 \u0645\u062d\u062f\u062f\u064b\u0627 \u0643\u0627\u0646\u062a \u0627\u0644\u0646\u062a\u064a\u062c\u0629 \u0623\u0641\u0636\u0644\u060c \u0648\u0625\u0646 \u0644\u0645 \u062a\u0639\u062c\u0628\u0643 \u0641\u0639\u062f\u0651\u0644 \u0627\u0644\u0637\u0644\u0628 \u0628\u062f\u0644 \u0623\u0646 \u062a\u0628\u062f\u0623 \u0645\u0646 \u0627\u0644\u0635\u0641\u0631.","\u0627\u0633\u062a\u0639\u0645\u0644\u0647 \u0644\u062a\u0644\u062e\u064a\u0635 \u0627\u0644\u0646\u0635\u0648\u0635\u060c \u0648\u062a\u0646\u0638\u064a\u0645 \u0627\u0644\u0623\u0641\u0643\u0627\u0631\u060c \u0648\u0635\u064a\u0627\u063a\u0629 \u0627\u0644\u0631\u0633\u0627\u0626\u0644\u060c \u0648\u062a\u0628\u0633\u064a\u0637 \u0627\u0644\u0645\u0648\u0627\u0636\u064a\u0639 \u0627\u0644\u0635\u0639\u0628\u0629. \u0627\u062c\u0639\u0644\u0647 \u0645\u0633\u0627\u0639\u062f\u064b\u0627 \u0644\u0643 \u0641\u064a \u0627\u0644\u0645\u0633\u0648\u062f\u0629 \u0627\u0644\u0623\u0648\u0644\u0649\u060c \u062b\u0645 \u0631\u0627\u062c\u0639 \u0623\u0646\u062a \u0627\u0644\u0646\u062a\u064a\u062c\u0629 \u0648\u0623\u0636\u0641 \u0644\u0645\u0633\u062a\u0643 \u0627\u0644\u0634\u062e\u0635\u064a\u0629.","\u0644\u0627 \u062a\u0639\u062a\u0645\u062f \u0639\u0644\u0649 \u0625\u062c\u0627\u0628\u062a\u0647 \u0641\u064a \u0627\u0644\u0635\u062d\u0629 \u0623\u0648 \u0627\u0644\u0645\u0627\u0644 \u0623\u0648 \u0627\u0644\u0642\u0627\u0646\u0648\u0646 \u062f\u0648\u0646 \u0645\u0631\u0627\u062c\u0639\u0629 \u0645\u0635\u062f\u0631 \u0645\u0648\u062b\u0648\u0642. \u062a\u062d\u0642\u0642 \u0645\u0646 \u0627\u0644\u0623\u0631\u0642\u0627\u0645 \u0648\u0627\u0644\u0623\u0633\u0645\u0627\u0621 \u0648\u0627\u0644\u0645\u0639\u0644\u0648\u0645\u0627\u062a \u0627\u0644\u0645\u0647\u0645\u0629\u060c \u0648\u0644\u0627 \u062a\u0634\u0627\u0631\u0643 \u0645\u0639\u0647 \u0628\u064a\u0627\u0646\u0627\u062a\u0643 \u0627\u0644\u0633\u0631\u064a\u0629 \u0623\u0648 \u0643\u0644\u0645\u0627\u062a \u0627\u0644\u0645\u0631\u0648\u0631."]},
{id:14,t:"\u0623\u0633\u0627\u0633\u064a\u0627\u062a \u0627\u0644\u062a\u0631\u0628\u064a\u0629 \u0627\u0644\u0625\u064a\u062c\u0627\u0628\u064a\u0629 \u0644\u0644\u0623\u0628\u0646\u0627\u0621",i:"\u0641\u0631\u064a\u0642 \u0623\u0643\u0627\u062f\u064a\u0645\u064a\u0629 \u062f\u064e\u0631\u0652\u0628",c:"\u062a\u0631\u0628\u064a\u0629 \u0623\u0633\u0631\u064a\u0629",e:"\ud83c\udfe1",g:"#b23a48,#fc7a57",r:0,n:0,p:0,l:["\u0627\u0644\u062d\u0648\u0627\u0631 \u0642\u0628\u0644 \u0627\u0644\u0639\u0642\u0627\u0628","\u0627\u0644\u0642\u062f\u0648\u0629 \u0642\u0628\u0644 \u0627\u0644\u0646\u0635\u064a\u062d\u0629","\u0648\u0636\u0639 \u062d\u062f\u0648\u062f \u0648\u0627\u0636\u062d\u0629 \u0628\u0647\u062f\u0648\u0621","\u0634\u062c\u0651\u0639 \u0627\u0644\u062c\u0647\u062f \u0644\u0627 \u0627\u0644\u0646\u062a\u064a\u062c\u0629 \u0641\u0642\u0637"],x:["\u0627\u062c\u0644\u0633 \u0645\u0639 \u0637\u0641\u0644\u0643 \u0648\u0627\u0633\u0645\u0639 \u0645\u0646\u0647 \u0633\u0628\u0628 \u062a\u0635\u0631\u0651\u0641\u0647 \u0642\u0628\u0644 \u0623\u0646 \u062a\u062d\u0627\u0633\u0628\u0647. \u0627\u0644\u062d\u0648\u0627\u0631 \u0627\u0644\u0647\u0627\u062f\u0626 \u064a\u0639\u0644\u0651\u0645\u0647 \u062a\u062d\u0645\u0651\u0644 \u0627\u0644\u0645\u0633\u0624\u0648\u0644\u064a\u0629\u060c \u0648\u064a\u0628\u0646\u064a \u062b\u0642\u062a\u0647 \u0628\u0643\u060c \u0641\u064a\u062d\u062f\u0651\u062b\u0643 \u0639\u0646 \u0645\u0634\u0643\u0644\u0627\u062a\u0647 \u0628\u062f\u0644 \u0623\u0646 \u064a\u062e\u0641\u064a\u0647\u0627.","\u0627\u0644\u0623\u0628\u0646\u0627\u0621 \u064a\u062a\u0639\u0644\u0645\u0648\u0646 \u0645\u0645\u0627 \u064a\u0631\u0648\u0646 \u0623\u0643\u062b\u0631 \u0645\u0645\u0627 \u064a\u0633\u0645\u0639\u0648\u0646. \u0625\u0646 \u0623\u0631\u062f\u062a \u0645\u0646\u0647\u0645 \u0627\u0644\u0635\u062f\u0642 \u0648\u0627\u0644\u0627\u062d\u062a\u0631\u0627\u0645 \u0648\u062a\u0646\u0638\u064a\u0645 \u0627\u0644\u0648\u0642\u062a \u0641\u0643\u0646 \u0623\u0646\u062a \u0627\u0644\u0645\u062b\u0627\u0644 \u0641\u064a \u0633\u0644\u0648\u0643\u0643 \u0627\u0644\u064a\u0648\u0645\u064a \u062f\u0627\u062e\u0644 \u0627\u0644\u0628\u064a\u062a.","\u0636\u0639 \u0642\u0648\u0627\u0639\u062f \u0642\u0644\u064a\u0644\u0629 \u0648\u0648\u0627\u0636\u062d\u0629 \u064a\u0641\u0647\u0645\u0647\u0627 \u0627\u0644\u062c\u0645\u064a\u0639\u060c \u0648\u0623\u062e\u0628\u0631 \u0637\u0641\u0644\u0643 \u0645\u0633\u0628\u0642\u064b\u0627 \u0628\u0645\u0627 \u064a\u062a\u0631\u062a\u0628 \u0639\u0644\u0649 \u0645\u062e\u0627\u0644\u0641\u062a\u0647\u0627. \u0646\u0641\u0651\u0630 \u0645\u0627 \u0642\u0644\u062a\u0647 \u0628\u0647\u062f\u0648\u0621 \u0648\u062b\u0628\u0627\u062a \u062f\u0648\u0646 \u0635\u0631\u0627\u062e\u060c \u0641\u0627\u0644\u062b\u0628\u0627\u062a \u0623\u0647\u0645 \u0645\u0646 \u0634\u062f\u0629 \u0627\u0644\u0639\u0642\u0648\u0628\u0629.","\u0627\u0645\u062f\u062d \u0645\u062c\u0647\u0648\u062f \u0637\u0641\u0644\u0643 \u0648\u0645\u062d\u0627\u0648\u0644\u0627\u062a\u0647\u060c \u0648\u0642\u0644 \u0644\u0647: \u0623\u0639\u062c\u0628\u0646\u064a \u0623\u0646\u0643 \u0644\u0645 \u062a\u0633\u062a\u0633\u0644\u0645. \u0647\u0630\u0627 \u064a\u0639\u0644\u0645\u0647 \u0627\u0644\u0645\u062b\u0627\u0628\u0631\u0629\u060c \u0648\u064a\u062c\u0639\u0644\u0647 \u064a\u0631\u0649 \u0627\u0644\u062e\u0637\u0623 \u0641\u0631\u0635\u0629 \u0644\u0644\u062a\u0639\u0644\u0645 \u0644\u0627 \u0633\u0628\u0628\u064b\u0627 \u0644\u0644\u062e\u062c\u0644."]},
{id:15,t:"\u0627\u0644\u062a\u0633\u0648\u064a\u0642 \u0639\u0628\u0631 \u0648\u0633\u0627\u0626\u0644 \u0627\u0644\u062a\u0648\u0627\u0635\u0644 \u0644\u0644\u0645\u0628\u062a\u062f\u0626\u064a\u0646",i:"\u0641\u0631\u064a\u0642 \u0623\u0643\u0627\u062f\u064a\u0645\u064a\u0629 \u062f\u064e\u0631\u0652\u0628",c:"\u062a\u0633\u0648\u064a\u0642",e:"\ud83d\udce3",g:"#7b2d5e,#c05c9b",r:0,n:0,p:0,l:["\u062d\u062f\u0651\u062f \u062c\u0645\u0647\u0648\u0631\u0643 \u0648\u0647\u062f\u0641\u0643","\u0645\u062d\u062a\u0648\u0649 \u064a\u062c\u0630\u0628 \u0627\u0644\u0627\u0646\u062a\u0628\u0627\u0647","\u0627\u062c\u0639\u0644 \u0627\u0644\u0642\u0627\u0631\u0626 \u064a\u062a\u062e\u0630 \u062e\u0637\u0648\u0629","\u0642\u0650\u0633 \u0627\u0644\u0646\u062a\u0627\u0626\u062c \u0648\u0637\u0648\u0651\u0631"],x:["\u0642\u0628\u0644 \u0623\u0646 \u062a\u0646\u0634\u0631\u060c \u0627\u0633\u0623\u0644: \u0645\u0646 \u0647\u0648 \u0639\u0645\u064a\u0644\u064a\u061f \u0648\u0645\u0627\u0630\u0627 \u0623\u0631\u064a\u062f \u0645\u0646\u0647: \u0645\u062a\u0627\u0628\u0639\u0629 \u0623\u0645 \u0631\u0633\u0627\u0644\u0629 \u0623\u0645 \u0634\u0631\u0627\u0621\u061f \u0643\u0644\u0645\u0627 \u0639\u0631\u0641\u062a \u062c\u0645\u0647\u0648\u0631\u0643 \u0648\u0647\u062f\u0641\u0643 \u0628\u062f\u0642\u0629\u060c \u0635\u0627\u0631\u062a \u0645\u0646\u0634\u0648\u0631\u0627\u062a\u0643 \u0623\u0642\u0635\u0631 \u0637\u0631\u064a\u0642\u064b\u0627 \u0625\u0644\u0649 \u0627\u0644\u0646\u062a\u064a\u062c\u0629.","\u0627\u0628\u062f\u0623 \u0628\u062c\u0645\u0644\u0629 \u062a\u0644\u0641\u062a \u0627\u0644\u0627\u0646\u062a\u0628\u0627\u0647 \u0641\u064a \u0623\u0648\u0644 \u0633\u0637\u0631\u060c \u062b\u0645 \u0642\u062f\u0651\u0645 \u0641\u0627\u0626\u062f\u0629 \u0648\u0627\u0636\u062d\u0629 \u0628\u0644\u063a\u0629 \u0628\u0633\u064a\u0637\u0629. \u0646\u0648\u0651\u0639 \u0628\u064a\u0646 \u0646\u0635\u0627\u0626\u062d \u0642\u0635\u064a\u0631\u0629 \u0648\u0642\u0635\u0635 \u0639\u0645\u0644\u0627\u0621 \u0648\u0635\u0648\u0631 \u0648\u0645\u0642\u0627\u0637\u0639\u060c \u0648\u0644\u0627 \u062a\u062c\u0639\u0644 \u0643\u0644 \u0645\u0646\u0634\u0648\u0631\u0627\u062a\u0643 \u0625\u0639\u0644\u0627\u0646\u0627\u062a.","\u0627\u062e\u062a\u0645 \u0643\u0644 \u0645\u0646\u0634\u0648\u0631 \u0628\u062e\u0637\u0648\u0629 \u0648\u0627\u062d\u062f\u0629 \u0648\u0627\u0636\u062d\u0629 \u0645\u062b\u0644: \u0631\u0627\u0633\u0644\u0646\u0627\u060c \u0623\u0648 \u0627\u062d\u062c\u0632 \u0627\u0644\u0622\u0646\u060c \u0623\u0648 \u0627\u062d\u0641\u0638 \u0627\u0644\u0645\u0646\u0634\u0648\u0631. \u0627\u0644\u0637\u0644\u0628 \u0627\u0644\u0648\u0627\u0636\u062d \u064a\u0631\u0641\u0639 \u0627\u0644\u062a\u0641\u0627\u0639\u0644 \u0623\u0643\u062b\u0631 \u0645\u0646 \u062a\u0631\u0643 \u0627\u0644\u0642\u0627\u0631\u0626 \u064a\u062e\u0645\u0651\u0646 \u0645\u0627\u0630\u0627 \u064a\u0641\u0639\u0644.","\u062a\u0627\u0628\u0639 \u0623\u064a \u0645\u0646\u0634\u0648\u0631 \u062c\u0627\u0628 \u0623\u0643\u0628\u0631 \u0639\u062f\u062f \u0645\u0646 \u0627\u0644\u062a\u0641\u0627\u0639\u0644 \u0648\u0627\u0644\u0631\u0633\u0627\u0626\u0644 \u0648\u0627\u0644\u0645\u0628\u064a\u0639\u0627\u062a. \u0643\u0631\u0651\u0631 \u0627\u0644\u0623\u0641\u0643\u0627\u0631 \u0627\u0644\u0646\u0627\u062c\u062d\u0629\u060c \u0648\u0623\u0648\u0642\u0641 \u0645\u0627 \u0644\u0627 \u064a\u0639\u0645\u0644\u060c \u0648\u062c\u0631\u0651\u0628 \u0641\u0643\u0631\u0629 \u062c\u062f\u064a\u062f\u0629 \u0643\u0644 \u0623\u0633\u0628\u0648\u0639 \u0628\u062f\u0644 \u062a\u063a\u064a\u064a\u0631 \u0643\u0644 \u0634\u064a\u0621 \u0645\u0631\u0629 \u0648\u0627\u062d\u062f\u0629."]},
{id:16,t:"\u0628\u0646\u0627\u0621 \u0627\u0644\u0639\u0627\u062f\u0627\u062a \u0627\u0644\u0646\u0627\u062c\u062d\u0629",i:"\u0641\u0631\u064a\u0642 \u0623\u0643\u0627\u062f\u064a\u0645\u064a\u0629 \u062f\u064e\u0631\u0652\u0628",c:"\u062a\u0637\u0648\u064a\u0631 \u0627\u0644\u0630\u0627\u062a",e:"\ud83c\udf31",g:"#0b5d3b,#52b788",r:0,n:0,p:0,l:["\u0627\u0628\u062f\u0623 \u0628\u0639\u0627\u062f\u0629 \u0635\u063a\u064a\u0631\u0629 \u062c\u062f\u064b\u0627","\u0627\u0631\u0628\u0637 \u0627\u0644\u0639\u0627\u062f\u0629 \u0628\u0648\u0642\u062a \u062b\u0627\u0628\u062a","\u0633\u0647\u0651\u0644 \u0627\u0644\u0637\u0631\u064a\u0642 \u0648\u0623\u0632\u0644 \u0627\u0644\u0639\u0648\u0627\u0626\u0642","\u0644\u0627 \u062a\u0642\u0637\u0639 \u0627\u0644\u0633\u0644\u0633\u0644\u0629 \u0645\u0631\u062a\u064a\u0646"],x:["\u0627\u062e\u062a\u0631 \u0639\u0627\u062f\u0629 \u0635\u063a\u064a\u0631\u0629 \u062a\u0633\u062a\u0637\u064a\u0639 \u0641\u0639\u0644\u0647\u0627 \u062d\u062a\u0649 \u0641\u064a \u0623\u0633\u0648\u0623 \u0623\u064a\u0627\u0645\u0643\u060c \u0645\u062b\u0644 \u0642\u0631\u0627\u0621\u0629 \u0635\u0641\u062d\u0629 \u0623\u0648 \u0627\u0644\u0645\u0634\u064a \u062e\u0645\u0633 \u062f\u0642\u0627\u0626\u0642. \u0627\u0644\u0628\u062f\u0627\u064a\u0629 \u0627\u0644\u0635\u063a\u064a\u0631\u0629 \u062a\u0628\u0646\u064a \u0627\u0644\u0627\u0633\u062a\u0645\u0631\u0627\u0631\u060c \u0648\u0628\u0639\u062f \u0623\u0646 \u062a\u062b\u0628\u062a \u062a\u0633\u062a\u0637\u064a\u0639 \u0623\u0646 \u062a\u0643\u0628\u0651\u0631\u0647\u0627.","\u0627\u0631\u0628\u0637 \u0639\u0627\u062f\u062a\u0643 \u0627\u0644\u062c\u062f\u064a\u062f\u0629 \u0628\u0634\u064a\u0621 \u062a\u0641\u0639\u0644\u0647 \u0643\u0644 \u064a\u0648\u0645\u060c \u0645\u062b\u0644: \u0628\u0639\u062f \u0635\u0644\u0627\u0629 \u0627\u0644\u0641\u062c\u0631 \u0623\u0642\u0631\u0623 \u0635\u0641\u062d\u0629. \u0627\u0644\u0631\u0628\u0637 \u0628\u0648\u0642\u062a \u062b\u0627\u0628\u062a \u064a\u function loadDb(){
  if(!SBC)return;
  Promise.all([
    SBC.from("courses").select("id,title,category,objectives,price_cents,instructor_id").eq("status","published"),
    SBC.from("lesson_outline").select("id,course_id,position,title").order("position"),
    SBC.from("instructor_public").select("id,display_name")
  ]).then(function(rs){
    if(rs[0].error)return;
    var by={},ins={};
    (rs[1].data||[]).forEach(function(l){(by[l.course_id]=by[l.course_id]||[]).push(l.title)});
    (rs[2].data||[]).forEach(function(x){ins[x.id]=x.display_name});
    COURSES=COURSES.filter(function(c){return !c.db});
    (rs[0].data||[]).forEach(function(r){
      COURSES.push({id:r.id,db:true,t:esc(r.title),i:esc(ins[r.instructor_id]||"\u0623\u0643\u0627\u062f\u064a\u0645\u064a\u0629 \u062f\u064e\u0631\u0652\u0628"),c:esc(r.category||"\u0623\u062e\u0631\u0649"),e:CATE[r.category]||"\ud83d\udcda",g:"#2b7a78,#3aafa9",r:0,n:0,p:(r.price_cents||0)/100,o:(r.objectives||[]).map(esc),l:(by[r.id]||[]).map(esc)});

  },function(){});

function dbLoadMine(c){
  if(!ME)return Promise.resolve();
  return SBC.from("enrollments").select("course_id").eq("course_id",c.id).eq("user_id",ME.id).then(function(r){
    if(!(r.data&&r.data.length)){delete S.prog[c.id];return}
    return Promise.all([
      SBC.from("lessons").select("id,title,body,activity,video_url,position").eq("course_id",c.id).order("position"),
      SBC.from("lesson_progress").select("lesson_id")
    ]).then(function(rs){
      var L=rs[0].data||[],done={};
      (rs[1].data||[]).forEach(function(x){done[x.lesson_id]=1});
      c.lid=L.map(function(l){return l.id});
      c.l=L.map(function(l){return esc(l.title)});
      c.x=L.map(function(l){return esc(l.body).replace(/\n/g,"<br>")});
      c.a=L.map(function(l){return esc(l.activity||"")});
      c.v=L.map(function(l){return l.video_url||""});
      S.prog[c.id]={done:L.map(function(l,i){return done[l.id]?i:-1}).filter(function(i){return i>=0})};
    });
  },function(){});
}

  var a=$("#app");
  if(!ME||(ME.role!=="instructor"&&ME.role!=="admin")){a.innerHTML='<div class="panel">\u0647\u0630\u0647 \u0627\u0644\u0635\u0641\u062d\u0629 \u0644\u0644\u0645\u062f\u0631\u0651\u0628\u064a\u0646 \u0641\u0642\u0637.</div>';return}
  a.innerHTML='<button class="back" id="bk">\u2039 \u0631\u062c\u0648\u0639</button><div class="panel"><h2 style="margin-top:0">\u062f\u0648\u0631\u0627\u062a\u064a</h2><div id="ml" class="meta">\u062c\u0627\u0631\u064d \u0627\u0644\u062a\u062d\u0645\u064a\u0644...</div></div><div class="panel" style="margin-top:14px"><h2 style="margin-top:0">\u062f\u0648\u0631\u0629 \u062c\u062f\u064a\u062f\u0629</h2><style>.f{display:block;margin:10px 0 4px;font-weight:600}.in{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;font:inherit;background:var(--bg);color:var(--ink)}</style><label class="f" for="ti">\u0639\u0646\u0648\u0627\u0646 \u0627\u0644\u062f\u0648\u0631\u0629</label><input class="in" id="ti" maxlength="150"><label class="f" for="de">\u0648\u0635\u0641 \u0642\u0635\u064a\u0631</label><textarea class="in" id="de" rows="3"></textarea><label class="f" for="ca">\u0627\u0644\u062a\u0635\u0646\u064a\u0641</label><input class="in" id="ca" placeholder="\u0645\u062b\u0627\u0644: \u062a\u0633\u0648\u064a\u0642"><label class="f" for="ob">\u0627\u0644\u0623\u0647\u062f\u0627\u0641 \u0627\u0644\u062a\u0639\u0644\u064a\u0645\u064a\u0629 (\u0633\u0637\u0631 \u0644\u0643\u0644 \u0647\u062f\u0641)</label><textarea class="in" id="ob" rows="3"></textarea><label class="f" for="ls">\u0627\u0644\u062f\u0631\u0648\u0633: \u0627\u0641\u0635\u0644 \u0628\u064a\u0646 \u0627\u0644\u062f\u0631\u0633 \u0648\u0627\u0644\u0630\u064a \u0628\u0639\u062f\u0647 \u0628\u0633\u0637\u0631 \u0641\u064a\u0647 \u062b\u0644\u0627\u062b \u0634\u0631\u0637\u0627\u062a (---). \u0623\u0648\u0644 \u0633\u0637\u0631 \u0641\u064a \u0627\u0644\u062f\u0631\u0633 \u0639\u0646\u0648\u0627\u0646\u0647 \u0648\u0627\u0644\u0628\u0627\u0642\u064a \u0646\u0635\u0647. \u0648\u064a\u0645\u0643\u0646 \u0625\u0636\u0627\u0641\u0629 \u0633\u0637\u0631 \u064a\u0628\u062f\u0623 \u0628\u0643\u0644\u0645\u0629 \u0641\u064a\u062f\u064a\u0648: \u062b\u0645 \u0631\u0627\u0628\u0637 https.</label><textarea class="in" id="ls" rows="10"></textarea><label class="f"><input type="checkbox" id="sb"> \u0623\u0631\u0633\u0644 \u0627\u0644\u062f\u0648\u0631\u0629 \u0644\u0644\u0645\u0631\u0627\u062c\u0639\u0629 \u0627\u0644\u0622\u0646</label><p class="meta">\u0627\u0644\u062f\u0648\u0631\u0627\u062a \u0627\u0644\u0645\u062f\u0641\u0648\u0639\u0629 \u063a\u064a\u0631 \u0645\u062a\u0627\u062d\u0629 \u0628\u0639\u062f\u060c \u0641\u0643\u0644 \u062f\u0648\u0631\u0629 \u062a\u064f\u0646\u0634\u0623 \u0645\u062c\u0627\u0646\u064a\u0629. \u0644\u0627 \u062a\u064f\u0646\u0634\u0631 \u0627\u0644\u062f\u0648\u0631\u0629 \u0642\u0628\u0644 \u0645\u0631\u0627\u062c\u0639\u0629 \u0627\u0644\u0625\u062f\u0627\u0631\u0629.</p><div id="msg" class="meta"></div><button class="btn" id="sv3" style="margin-right:0">\u062d\u0641\u0638 \u0627\u0644\u062f\u0648\u0631\u0629</button></div>';
  $("#bk").onclick=function(){S.view="auth";render()};
  loadMine();
  $("#sv3").onclick=function(){
    var msg=$("#msg");msg.style.color="#c0392b";
    var ti=$("#ti").value.trim(),de=$("#de").value.trim(),ca=$("#ca").value.trim();
    var ob=$("#ob").value.split("\n").map(function(x){return x.trim()}).filter(Boolean);
    var raw=$("#ls").value.split(/\n\s*-{3,}\s*\n/).map(function(x){return x.trim()}).filter(Boolean);
    var L=raw.map(function(blk){
      var lines=blk.split("\n"),t=lines.shift().trim(),v=null,body=[];
      lines.forEach(function(x){var m=x.match(/^\s*\u0641\u064a\u062f\u064a\u0648:\s*(https:\/\/\S+)\s*$/);if(m&&!v)v=m[1];else body.push(x)});
      return {t:t.slice(0,150),b:body.join("\n").trim(),v:v};
    });
    if(ti.length<3){msg.textContent="\u0627\u0643\u062a\u0628 \u0639\u0646\u0648\u0627\u0646\u064b\u0627 \u0644\u0644\u062f\u0648\u0631\u0629 (\u0663 \u0623\u062d\u0631\u0641 \u0639\u0644\u0649 \u0627\u0644\u0623\u0642\u0644).";return}
    if(!L.length||L.some(function(l){return !l.t||!l.b})){msg.textContent="\u0644\u0643\u0644 \u062f\u0631\u0633 \u0639\u0646\u0648\u0627\u0646 \u0648\u0646\u0635. \u0627\u0641\u0635\u0644 \u0628\u064a\u0646 \u0627\u0644\u062f\u0631\u0648\u0633 \u0628\u0633\u0637\u0631 ---.";return}
    var go=$("#sb").checked;$("#sv3").disabled=true;
    SBC.from("courses").insert({title:ti,description:de,category:ca,objectives:ob,price_cents:0,status:"draft"}).select("id").single().then(function(r){
      if(r.error||!r.data){$("#sv3").disabled=false;msg.textContent="\u062a\u0639\u0630\u0651\u0631 \u0625\u0646\u0634\u0627\u0621 \u0627\u0644\u062f\u0648\u0631\u0629. \u062a\u062d\u0642\u0642 \u0645\u0646 \u0635\u0644\u0627\u062d\u064a\u0627\u062a\u0643.";return}
      var cid=r.data.id;
      SBC.from("lessons").insert(L.map(function(l,i){return {course_id:cid,position:i,title:l.t,body:l.b,video_url:l.v}})).then(function(r2){
        if(r2.error){SBC.from("courses").delete().eq("id",cid).then(function(){});$("#sv3").disabled=false;msg.textContent="\u062a\u0639\u0630\u0651\u0631 \u062d\u0641\u0638 \u0627\u0644\u062f\u0631\u0648\u0633\u060c \u0641\u0644\u0645 \u062a\u064f\u062d\u0641\u0638 \u0627\u0644\u062f\u0648\u0631\u0629. \u062a\u062d\u0642\u0642 \u0645\u0646 \u0631\u0648\u0627\u0628\u0637 \u0627\u0644\u0641\u064a\u062f\u064a\u0648 \u0648\u062d\u0627\u0648\u0644 \u0645\u0631\u0629 \u0623\u062e\u0631\u0649.";return}
        var fin=function(){$("#sv3").disabled=false;msg.style.color="var(--brand)";msg.textContent=go?"\u062a\u0645 \u0627\u0644\u062d\u0641\u0638 \u0648\u0625\u0631\u0633\u0627\u0644 \u0627\u0644\u062f\u0648\u0631\u0629 \u0644\u0644\u0645\u0631\u0627\u062c\u0639\u0629.":"\u062a\u0645 \u062d\u0641\u0638 \u0627\u0644\u062f\u0648\u0631\u0629 \u0643\u0645\u0633\u0648\u062f\u0629.";$("#ti").value="";$("#de").value="";$("#ca").value="";$("#ob").value="";$("#ls").value="";$("#sb").checked=false;loadMine()};
        if(go)SBC.from("courses").update({status:"pending"}).eq("id",cid).then(fin);else fin();
      });
    });
  };
}
function admView(){
  var a=$("#app");
  if(!ME||ME.role!=="admin"){a.innerHTML='<div class="panel">\u0647\u0630\u0647 \u0627\u0644\u0635\u0641\u062d\u0629 \u0644\u0645\u062f\u064a\u0631 \u0627\u0644\u0645\u0646\u0635\u0629 \u0641\u0642\u0637.</div>';return}
  a.innerHTML='<button class="back" id="bk">\u2039 \u0631\u062c\u0648\u0639</button><div class="panel"><h2 style="margin-top:0">\u0645\u0631\u0627\u062c\u0639\u0629 \u0627\u0644\u062f\u0648\u0631\u0627\u062a</h2><div id="al" class="meta">\u062c\u0627\u0631\u064d \u0627\u0644\u062a\u062d\u0645\u064a\u0644...</div></div>';
  $("#bk").onclick=function(){S.view="auth";render()};
  SBC.from("courses").select("id,title,category").eq("status","pending").order("created_at").then(function(r){
    var al=$("#al");al.innerHTML="";
    if(r.error){al.textContent="\u062a\u0639\u0630\u0651\u0631 \u062a\u062d\u0645\u064a\u0644 \u0627\u0644\u062f\u0648\u0631\u0627\u062a.";return}
    if(!r.data.length){al.textContent="\u0644\u0627 \u062a\u0648\u062c\u062f \u062f\u0648\u0631\u0627\u062a \u0628\u0627\u0646\u062a\u0638\u0627\u0631 \u0627\u0644\u0645\u0631\u0627\u062c\u0639\u0629.";return}
    r.data.forEach(function(c){
      var d=document.createElement("div");d.style.cssText="border-top:1px solid var(--line);padding:10px 0";
      d.innerHTML='<strong>'+esc(c.title)+'</strong><div class="meta">'+esc(c.category||"")+'</div>';
      var pv=document.createElement("div");pv.style.cssText="margin-top:8px;line-height:1.9";
      var bp=document.createElement("button");bp.className="btn alt";bp.style.margin="6px 0 0 8px";bp.textContent="\u0645\u0639\u0627\u064a\u0646\u0629 \u0627\u0644\u062f\u0631\u0648\u0633";
      bp.onclick=function(){SBC.from("lessons").select("title,body,video_url,position").eq("course_id",c.id).order("position").then(function(x){
        pv.innerHTML="";(x.data||[]).forEach(function(l){var p=document.createElement("div");p.style.cssText="margin:8px 0;padding:8px;border:1px solid var(--line);border-radius:10px";p.innerHTML='<strong>'+esc(l.title)+'</strong><br>'+esc(l.body).replace(/\n/g,"<br>")+(l.video_url?'<br><span class="meta">\u0641\u064a\u062f\u064a\u0648: '+esc(l.video_url)+'</span>':'');pv.appendChild(p)});
        if(!(x.data||[]).length)pv.textContent="\u0644\u0627 \u062a\u0648\u062c\u062f \u062f\u0631\u0648\u0633.";
      })};
      d.appendChild(bp);
      [["\u0646\u0634\u0631","published"],["\u0631\u0641\u0636","rejected"]].forEach(function(z){
        var b=document.createElement("button");b.className="btn"+(z[1]==="rejected"?" alt":"");b.style.margin="6px 0 0 8px";b.textContent=z[0];
        b.onclick=function(){b.disabled=true;SBC.from("courses").update({status:z[1]}).eq("id",c.id).then(function(r2){
          if(r2.error){b.disabled=false;b.textContent="\u0641\u0634\u0644";return}
          d.remove();if(z[1]==="published")loadDb();
        })};
        d.appendChild(b);
      });
      d.appendChild(pv);al.appendChild(d);
    });
  });
}
function render(){S.view==="course"?course():S.view==="add"?addForm():S.view==="addp"?addProd():S.view==="cert"?cert():S.view==="quiz"?quiz():S.view==="auth"?authView():S.view==="recover"?recoverView():S.view==="inst"?instView():S.view==="adm"?admView():(S.view==="privacy"||S.view==="contact")?pageView(S.view):home()}
$("#addp").onclick=function(){S.view="addp";render();window.scrollTo(0,0)};
$("#auth").onclick=function(){S.view="auth";render();window.scrollTo(0,0)};
loadSB();
$("#fp").onclick=function(e){e.preventDefault();S.view="privacy";render();window.scrollTo(0,0)};
$("#fc").onclick=function(e){e.preventDefault();S.view="contact";render();window.scrollTo(0,0)};
$("#add").onclick=function(){S.view="add";render();window.scrollTo(0,0)};
$("#q").oninput=function(e){S.q=e.target.value;S.view="home";render()};
$("#mine").onclick=function(){S.mineOnly=!S.mineOnly;this.textContent=S.mineOnly?"\u0643\u0644 \u0627\u0644\u062f\u0648\u0631\u0627\u062a":"\u062a\u0639\u0644\u0651\u0645\u064a";S.view="home";render()};
$("#home").onclick=function(){S.mineOnly=false;S.cat="\u0627\u0644\u0643\u0644";S.q="";$("#q").value="";$("#mine").textContent="\u062a\u0639\u0644\u0651\u0645\u064a";S.view="home";render()};
render();
(async function(){try{
  var u=await claude.use("user");DB=await claude.use("db");if(!DB)return;
  if(u&&u.canEdit()){$("#add").hidden=false;$("#addp").hidden=false}
  DB.collection("products").onSnapshot(function(s){PRODUCTS=s.docs.map(function(d){return d.data()});if(S.view==="home")render()},function(){});
  var base=COURSES.filter(function(c){return c.id<1000});
  DB.collection("courses").onSnapshot(function(s){
    COURSES=base.concat(s.docs.map(function(d){return d.data()}));
    if(S.view==="home")render();
  },function(){});
  if(u&&u.can("data.write")){
    var id=await u.id();var pd=DB.collection("data/users/"+id).doc("progress");
    var ps=await pd.get();
    if(ps.exists){var rp=ps.data().prog||{};for(var k in rp)if(!S.prog[k])S.prog[k]=rp[k];if(S.view==="home")render()}
    SAVE=function(){clearTimeout(SAVE.t);SAVE.t=setTimeout(function(){pd.set({prog:S.prog}).catch(function(){})},700)};
  }
}catch(e){}})();
</script>
